version: "3"
services:
  fastpages: &fastpages
    working_dir: /data
    environment:
        - INPUT_BOOL_SAVE_MARKDOWN=false
    build:
      context: ./_action_files
      dockerfile: ./Dockerfile
    image: fastpages-dev
    logging:
      driver: json-file
      options:
        max-size: 50m
    stdin_open: true
    tty: true
    volumes:
      - .:/data/

  converter:
    <<: *fastpages
    command: /fastpages/action_entrypoint.sh

  watcher:
    <<: *fastpages
    command: watchmedo shell-command --command /fastpages/action_entrypoint.sh --pattern *.ipynb --recursive --drop

  jekyll:
    working_dir: /data
    image: ruby:3.2
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - .:/data/
      # persist installed gems so restarts don't re-download the bundle
      - jekyll-bundle:/usr/local/bundle
    command: >
     bash -c "gem install bundler -v 2.4.22 --conservative
     && (bundle check || bundle install)
     && bundle exec jekyll serve --trace --strict_front_matter --host 0.0.0.0"

volumes:
  jekyll-bundle:

