version: "3"
services:
  converter: &converter
    working_dir: /data
    image: python:3.12-slim
    logging:
      driver: json-file
      options:
        max-size: 50m
    stdin_open: true
    tty: true
    volumes:
      - .:/data/
      - converter-pip:/root/.cache/pip
    command: >
     bash -c "pip install -q -r _action_files/requirements.txt
     && python _action_files/nb2post.py"

  # Re-run the converter whenever a notebook changes.
  watcher:
    <<: *converter
    command: >
     bash -c "pip install -q -r _action_files/requirements.txt watchdog
     && python _action_files/nb2post.py
     && watchmedo shell-command --command 'python _action_files/nb2post.py'
        --patterns '*.ipynb' --recursive --drop _notebooks"

  jekyll:
    working_dir: /data
    image: ruby:3.2
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - .:/data/
      # persist installed gems so restarts don't re-download the bundle
      - jekyll-bundle:/usr/local/bundle
    command: >
     bash -c "gem install bundler -v 2.4.22 --conservative
     && (bundle check || bundle install)
     && bundle exec jekyll serve --trace --strict_front_matter --host 0.0.0.0"

volumes:
  jekyll-bundle:
  converter-pip:

