<article class="post-card">
    {%- if post.image -%}
    <div class="post-card-media">
        <img class="image-preview" src="{{ post.image | relative_url }}" alt="{{ post.title | escape }}" loading="lazy" />
    </div>
    {%- else -%}
    <div class="post-card-media post-card-media--placeholder" aria-hidden="true">
        <span>{{ post.title | slice: 0 }}</span>
    </div>
    {%- endif -%}
    <div class="post-card-body">
        <h3 class="post-card-title">
          <a class="post-link" href="{{ post.url | relative_url }}">
            {{ post.title | escape }}
          </a>
        </h3>
        <p class="post-meta-description">{{ post.description }}</p>
        <p class="post-meta">{{ post.date | date: date_format }}</p>
    </div>
</article>
