name: CI
on:
  push:
    branches:
      - master # need to filter here so we only deploy when there is a push to master
  # no filters on pull requests, so intentionally left blank
  pull_request: 

# One deploy at a time. Two runs force-pushing gh-pages can publish out of
# order, leaving the older build live, so pushes to master queue rather than
# race. A superseded PR build is pure waste, so those cancel instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:     
  build-site:
    if: ( github.event.commits[0].message != 'Initial commit' ) || github.run_number > 1
    runs-on: ubuntu-latest
    steps:

    - name: Copy Repository Contents
      uses: actions/checkout@master
      with:
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # uv rather than pip: installing the 32-package tree takes ~2.6s under pip
    # with a warm wheel cache and ~0.4s under uv. setup-uv does the caching, so
    # setup-python no longer needs cache: pip.
    - name: Setup uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: _action_files/requirements.txt

    - name: convert notebooks to posts
      run: |
        uv pip install --system -r _action_files/requirements.txt
        python _action_files/nb2post.py

    - name: setup directories for Jekyll build
      run: |
        rm -rf _site
        sudo chmod -R 777 .

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: Jekyll build
      run: bundle exec jekyll build -V --strict_front_matter --trace
      env:
        JEKYLL_ENV: 'production'
        
    - name: copy CNAME file into _site if CNAME exists
      run: |
        sudo chmod -R 777 _site/
        cp CNAME _site/ 2>/dev/null || :

    - name: Deploy
      if: github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v4
      with:
        deploy_key: ${{ secrets.SSH_DEPLOY_KEY }}
        publish_dir: ./_site
